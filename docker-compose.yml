services:
  # PostgreSQL + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: penalty_kb
      POSTGRES_USER: kb_admin
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change-me-in-production}
    ports:
      # Windows Hyper-V 常占用 5432；宿主机用 PG_HOST_PORT（默认 15432）
      - "${PG_HOST_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kb_admin"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6534}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # 可选整栈 API；日常开发可用本机 make api
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment: &app_env
      DATABASE_URL: postgresql://kb_admin:${PG_PASSWORD:-change-me-in-production}@postgres:5432/penalty_kb
      REDIS_URL: redis://redis:6379
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local_bge_m3}
      RETRIEVAL_BACKEND: ${RETRIEVAL_BACKEND:-bge_m3}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-true}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      UPLOAD_DIR: /app/uploads
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data

  # OCR Worker（扫描件）；文字版 PDF 可本机 make worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker.ocr
    env_file: .env
    environment: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data

volumes:
  pgdata:

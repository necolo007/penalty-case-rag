[project]
name = "penalty-case-rag"
version = "1.0.0"
description = "保险监管处罚案例知识库构建与合规审查智能匹配（后端 RAG 系统）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "asyncpg>=0.29",
    "redis>=5.0",
    "arq>=0.26",
    "openai>=1.40",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "jieba>=0.42",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
# 本地模型（BGE-M3 召回 / Embedding 兜底 / Reranker 精排）
local-models = [
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.2",
    "torch>=2.2",
]
# MinerU 文档解析（可选；扫描件 OCR 仅通过 Docker Worker，勿本机装 OCR）
parsing-mineru = [
    "magic-pdf[full]>=0.7",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
# 任务1 长字段评测（BERTScore）
eval = [
    "bert-score>=0.3.13",
    "transformers>=4.40",
    "torch>=2.2",
]

[tool.setuptools]
packages = { find = { include = ["api*", "core*", "db*", "engine*", "pipeline*"] } }

[tool.setuptools.package-data]
db = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
